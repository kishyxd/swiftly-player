name: Make-Adhoc-Profile

on:
  push:
    branches: [main]
    paths: ['.github/workflows/make-adhoc-profile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Find the live profile API
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          mkdir -p /tmp/p && cd /tmp/p
          AUTH="$APPLE_ID:$APPLE_APP_SPEC_PW"
          UDID="00008140-001C31803E90801C"

          probe () {
            local name="$1"; shift
            local code
            code=$(curl -s -o "r_$name" -w '%{http_code}' "$@")
            printf '%-34s HTTP %s  ' "$name" "$code"
            head -c 180 "r_$name" | tr -d '\n' | sed 's/  */ /g'
            echo
          }

          echo "=== the downloadws endpoints (a GET, no body) ==="
          for ws in listDevices listCertificates listAppIds listProfiles listBundleIds; do
            probe "dw_$ws" -u "$AUTH" "https://developer.apple.com/services-account/QH65B2/downloadws/$ws.action"
          done

          echo
          echo "=== the same, as a POST with an empty body (the 411 wants a content length) ==="
          for ws in listDevices listCertificates listAppIds; do
            probe "dwp_$ws" -u "$AUTH" -H 'Content-Type: application/json' -X POST --data '{}' \
              "https://developer.apple.com/services-account/QH65B2/downloadws/$ws.action"
          done

          echo
          echo "=== the ASC iris endpoints with basic auth ==="
          for p in devices certificates bundleIds profiles; do
            probe "iris_$p" -u "$AUTH" "https://appstoreconnect.apple.com/iris/v1/$p"
          done

          echo
          echo "=== the ASC web api ==="
          for p in devices certificates bundleIds profiles; do
            probe "asc_$p" -u "$AUTH" "https://api.appstoreconnect.apple.com/v1/$p"
          done

          echo
          echo "=== the portal's account endpoints ==="
          for p in listDevices listCertificates listAppIds listProfiles; do
            probe "acct_$p" -u "$AUTH" "https://developer.apple.com/services-account/QH65B2/account/$p.action"
          done

          echo
          echo "=== does basic auth work at all? (the altool endpoint) ==="
          probe "altool_ping" -u "$AUTH" "https://appstoreconnect.apple.com/Authentication/v1/token"

      - name: Upload the probe
        uses: actions/upload-artifact@v4
        with:
          name: apple-api-probe
          path: /tmp/p
          retention-days: 3
