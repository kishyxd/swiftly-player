# Android build (direct flavor) on a macOS runner.
#
# **Why a macOS runner.** The Swift core for Android is built by `swiftly` with the
# Swift 6.3.3 toolchain and the Swift SDK for Android; the Gradle build then packages
# the resulting `.so` files into the APK. `Android/core/build.gradle` hardcodes the
# macOS paths of the toolchain, the NDK and the Swift SDK, so the job runs on macOS.
#
# **Two things are not on the runner and are installed here:**
# 1. Swiftly with the Swift 6.3.3 toolchain (`swiftly install 6.3.3`).
# 2. The Swift SDK for Android (`swift-6.3.3-RELEASE_android.artifactbundle`).
#    The bundle ships without an NDK sysroot, so `setup-android-sdk.sh` has to run
#    once with `ANDROID_NDK_HOME` pointing at the runner's NDK 27.
#
# **Third thing that is built here:** `org.swift.swiftkit:swiftkit-core`. It is not
# published to Maven Central; `Android/settings.gradle.kts` picks it up from
# `mavenLocal()`. It is built from the swift-java checkout that SwiftPM already
# resolved for the Swift package and published into `~/.m2/repository`.

name: Android

on:
  push:
    branches:
      - ci/android-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.3.3"
  SWIFT_SDK_BUNDLE: "swift-6.3.3-RELEASE_android.artifactbundle"
  SWIFT_SDK_SHA256: "d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5"

jobs:
  build:
    name: direct release APK
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java for Gradle
        run: |
          set -euo pipefail
          # AGP 8.13.0, Kotlin 2.0.21 and Gradle 9.4.0 are happy with JDK 21,
          # which is the default on the image.
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          java -version

      - name: Install swiftly
        run: |
          set -euo pipefail
          curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          set -euo pipefail
          ~/.swiftly/bin/swiftly install "$SWIFT_VERSION" --use
          ~/.swiftly/bin/swiftly list
          ~/.swiftly/bin/swiftly run swift --version

      - name: Download the Swift SDK for Android
        run: |
          set -euo pipefail
          curl -fsSL -o swift-sdk.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle.tar.gz"
          echo "${SWIFT_SDK_SHA256}  swift-sdk.tar.gz" | shasum -a 256 -c -

      - name: Install the Swift SDK for Android
        run: |
          set -euo pipefail
          # `swift sdk install` puts the bundle into the shared SwiftPM directory
          # (~/Library/org.swift.swiftpm/swift-sdks on macOS), which is exactly where
          # `Android/core/build.gradle` expects it.
          ~/.swiftly/bin/swiftly run swift sdk install "$PWD/swift-sdk.tar.gz"
          sdks="$HOME/Library/org.swift.swiftpm/swift-sdks"
          ls -1 "$sdks/"
          if [ ! -d "$sdks/$SWIFT_SDK_BUNDLE" ]; then
            echo "Expected the bundle at $sdks/$SWIFT_SDK_BUNDLE" >&2
            exit 1
          fi
          ~/.swiftly/bin/swiftly run swift sdk list

      - name: Link the NDK into the Swift SDK
        run: |
          set -euo pipefail
          # The bundle has no ndk-sysroot of its own: the script symlinks the NDK's
          # sysroot into it and points the clang resource directory at the NDK.
          export ANDROID_NDK_HOME="$HOME/Library/Android/sdk/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          bundle="$HOME/Library/org.swift.swiftpm/swift-sdks/${SWIFT_SDK_BUNDLE}"
          bash "$bundle/swift-android/scripts/setup-android-sdk.sh"
          test -e "$bundle/swift-android/ndk-sysroot/usr/include"
          ls -1 "$bundle/swift-android/ndk-sysroot/usr/lib/"

      - name: Host SDK for the Swift toolchain
        run: |
          set -euo pipefail
          # `Android/core/build.gradle` pins SDKROOT to MacOSX26.5.sdk, because a
          # newer Command Line Tools points MacOSX.sdk at 27.0, whose libSystem.B.tbd
          # names the architecture arm64e.x1 and breaks the Swift 6.3.3 linker.
          want="/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk"
          if [ ! -d "$want" ]; then
            for alt in \
              /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk \
              /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk \
              "$(xcrun --show-sdk-path --sdk macosx)"; do
              if [ -d "$alt" ]; then
                echo "MacOSX26.5.sdk is missing; linking $want -> $alt" >&2
                sudo ln -sfn "$alt" "$want"
                break
              fi
            done
          fi
          ls -d "$want"

      - name: Publish swiftkit-core to the local Maven repository
        run: |
          set -euo pipefail
          # `Android/core/swift/Package.swift` depends on swift-java 0.6.0; SwiftPM
          # checks it out for the jextract plugin. The same checkout contains the
          # SwiftKitCore Gradle module that produces org.swift.swiftkit:swiftkit-core,
          # which `Android/settings.gradle.kts` resolves from mavenLocal().
          cd Android/core/swift
          ~/.swiftly/bin/swiftly run swift package resolve
          checkout="$(ls -d .build/checkouts/swift-java)"
          ls -1 .build/checkouts/
          # swift-java's Gradle build needs a JDK 25 toolchain and calls
          # `swiftc -print-target-info` while configuring, so both the JDK and the
          # toolchain's bin directory go into the environment.
          export JAVA_HOME="$(/usr/libexec/java_home -v 25)"
          export PATH="$(ls -d "$HOME"/Library/Developer/Toolchains/*.xctoolchain/usr/bin | head -1):$PATH"
          java -version
          swiftc -print-target-info > /dev/null
          bash "$checkout/gradlew" \
            --project-dir "$checkout" \
            :SwiftKitCore:publishToMavenLocal \
            -PswiftkitVersion=1.0.0 \
            -PskipSamples=true
          find "$HOME/.m2/repository/org/swift/swiftkit" \( -name '*.jar' -o -name '*.pom' \) | sort

      - name: Build the direct release APK
        run: |
          set -euo pipefail
          cd Android
          ./gradlew :phone:assembleDirectRelease --stacktrace

      - name: Inspect the APK
        run: |
          set -euo pipefail
          apk="$(ls Android/phone/build/outputs/apk/direct/release/*.apk | head -1)"
          echo "APK: $apk"
          ls -l "$apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$apk" | head -20

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-direct-release
          path: Android/phone/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error
