name: probe7

# The Swift type checker gave up on the preview box expression in
# Sources/iOS/PlayerScreen.swift. Upstream builds the identical code on the
# author's Mac, so this is the solver hitting a budget, not a bug.
#
# IMPORTANT flag syntax, learned the hard way:
#   -solver-memory-threshold <value>     <- SPACE, not `=`
#   -solver-scope-threshold=<value>      <- `=`
#   -solver-trail-threshold=<value>      <- `=`
#   -solver-expression-time-threshold=<value>  <- `=`
#
# A space-separated value cannot go through `-Xfrontend` (which takes exactly
# one argument), so it must be passed as a plain compiler flag instead:
#   -Xfrontend -solver-memory-threshold -Xfrontend 4000000000
# ...except that then the driver sees the value as a separate unknown
# argument. The working form is to pass it WITHOUT -Xfrontend:
#   OTHER_SWIFT_FLAGS="-solver-memory-threshold=4000000000 ..."
# so the driver forwards the pair as one argument.
#
# Legs:
#   a) the scope + trail limits raised, with the memory limit as a plain flag
#   b) the same plus a big time threshold
#   c) the memory limit only, very large
#   d) the scope threshold only, very large
#
# No source change.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe7
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-scope-trail
            flags: '-Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000'
          - name: b-scope-trail-time
            flags: '-Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000 -Xfrontend -solver-expression-time-threshold=600000'
          - name: c-memory
            flags: '-solver-memory-threshold=4000000000'
          - name: d-scope
            flags: '-Xfrontend -solver-scope-threshold=10000'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            "OTHER_SWIFT_FLAGS=\$(inherited) $FLAGS" \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -20
          exit 0
