name: ASC-TVOS-Platform

on:
  push:
    branches: [main]
    paths: ['.github/workflows/asc-tvos-platform.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tvos:
    runs-on: macos-14
    steps:
      - name: The App Store Connect app record
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          cd /tmp
          echo "### 1. does the app record have a tvOS platform version?"
          xcrun altool --upload-app --file /dev/null --type ios \
            -u "$APPLE_ID" -p "$APPLE_APP_SPEC_PW" --team-id "$APPLE_TEAM_ID" 2>&1 | head -5 | tee a1.txt

          echo "### 2. the apps list through altool's own session"
          # altool authenticates with a session cookie; capture it the same way
          # altool does, then use it for the iris api.
          curl -s -c /tmp/cj.txt -o /tmp/tok.json -w 'HTTP %{http_code}\n' \
            -u "$APPLE_ID:$APPLE_APP_SPEC_PW" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'X-Apple-Store-Front: 143441-1,29' -H 'X-Apple-I-MD: 1' \
            -H 'X-Apple-Client-Application: iTMSTransporter' \
            -X POST 'https://appstoreconnect.apple.com/Authentication/v1/token' \
            -d "{\"appName\":\"iTMSTransporter\",\"appleId\":\"$APPLE_ID\",\"password\":\"$APPLE_APP_SPEC_PW\"}" | tee a2.txt
          head -c 500 /tmp/tok.json; echo
          echo "--- the cookies ---"
          cat /tmp/cj.txt | grep -v '^#' | head -8

          echo "### 3. the app record through iris"
          curl -s -b /tmp/cj.txt -o /tmp/app.json -w 'HTTP %{http_code}\n' \
            'https://appstoreconnect.apple.com/iris/v1/apps/6823967654' | tee a3.txt
          head -c 900 /tmp/app.json; echo

          echo "### 4. the platform versions"
          for u in \
            'https://appstoreconnect.apple.com/iris/v1/appStoreVersions?filter[app]=6823967654' \
            'https://appstoreconnect.apple.com/iris/v1/platforms' ; do
            echo "--- $u"
            curl -s -b /tmp/cj.txt -o /tmp/pv.json -w 'HTTP %{http_code}\n' "$u"
            head -c 700 /tmp/pv.json; echo
          done

      - name: Upload the probe
        uses: actions/upload-artifact@v4
        with:
          name: asc-tvos-probe
          path: /tmp
          retention-days: 3
