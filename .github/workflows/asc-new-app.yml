name: ASC-New-App

on:
  push:
    branches: [main]
    paths: ['.github/workflows/asc-new-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newapp:
    runs-on: macos-14
    steps:
      - name: The App Store Connect session
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          cd /tmp
          echo "### the transporter auth, the way altool does it"
          # altool posts the appName+appleId+password to the token endpoint
          # and follows the redirect to /login, which sets a session cookie.
          curl -s -L -c /tmp/cj.txt -b /tmp/cj.txt -o /tmp/tok.json \
            -w 'HTTP %{http_code}\n' \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'X-Apple-Store-Front: 143441-1,29' \
            -H 'X-Apple-I-MD: 1' -H 'X-Apple-I-MD-M: 1' \
            -H 'X-Apple-I-MD-RINFO: 1' -H 'X-Apple-I-MD-RS: 1' \
            -H 'X-Apple-I-MD-RENV: 1' -H 'X-Apple-I-MD-RM: 1' \
            -H 'X-Apple-Client-Application: iTMSTransporter' \
            -u "$APPLE_ID:$APPLE_APP_SPEC_PW" \
            -X POST 'https://appstoreconnect.apple.com/Authentication/v1/token' \
            -d "{\"appName\":\"iTMSTransporter\",\"appleId\":\"$APPLE_ID\",\"password\":\"$APPLE_APP_SPEC_PW\"}"
          head -c 400 /tmp/tok.json; echo
          echo "--- the cookies ---"
          grep -v '^#' /tmp/cj.txt | head -10

          echo "### the iris apps list"
          curl -s -b /tmp/cj.txt -o /tmp/apps.json -w 'HTTP %{http_code}\n' \
            'https://appstoreconnect.apple.com/iris/v1/apps'
          head -c 1200 /tmp/apps.json; echo

          echo "### the bundle ids"
          curl -s -b /tmp/cj.txt -o /tmp/bids.json -w 'HTTP %{http_code}\n' \
            'https://appstoreconnect.apple.com/iris/v1/bundleIds'
          head -c 900 /tmp/bids.json; echo

          echo "### the existing app record's platform versions"
          curl -s -b /tmp/cj.txt -o /tmp/ver.json -w 'HTTP %{http_code}\n' \
            'https://appstoreconnect.apple.com/iris/v1/appStoreVersions?filter[app]=6823967654'
          head -c 1200 /tmp/ver.json; echo

      - name: The probe output
        uses: actions/upload-artifact@v4
        with:
          name: asc-new-app-probe
          path: /tmp
          retention-days: 3
