name: ASC-Key

on:
  push:
    branches: [main]
    paths: ['.github/workflows/asc-key.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: The portal session through fastlane
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_SKIP_2FA: 'true'
        run: |
          set +x
          cd /tmp
          cat > /tmp/lane.rb <<'RUBY'
          require 'spaceship'
          begin
            Spaceship::Portal.apple_portal
            puts 'PORTAL_OK'
            apps = Spaceship::Portal.app_ids
            puts "APPIDS_COUNT #{apps.size}"
            apps.first(12).each do |a|
              puts "APPID #{a.bundle_id} | #{a.name} | #{a.app_id}"
            end
            devs = Spaceship::Portal.devices
            puts "DEVICES_COUNT #{devs.size}"
            devs.first(10).each do |d|
              puts "DEVICE #{d.udid} | #{d.name}"
            end
            certs = Spaceship::Portal.certificates
            puts "CERTS_COUNT #{certs.size}"
            certs.first(10).each do |c|
              puts "CERT #{c.id} | #{c.name} | #{c.certificate_type}"
            end
            profiles = Spaceship::Portal.profiles
            puts "PROFILES_COUNT #{profiles.size}"
            profiles.first(12).each do |p|
              puts "PROFILE #{p.name} | #{p.profile_type} | exp=#{p.expiration_date} | #{p.app_id}"
            end
          rescue => e
            puts "PORTAL_FAIL #{e.class}: #{e.message.to_s[0,400]}"
          end
          RUBY
          ruby /tmp/lane.rb 2>&1 | tail -60 | tee a1.txt

      - name: The output
        uses: actions/upload-artifact@v4
        with:
          name: asc-key-probe
          path: /tmp
          retention-days: 3
