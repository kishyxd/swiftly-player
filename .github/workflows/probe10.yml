name: probe10

# The solver thresholds are 32-bit (max 2147483647). The values above that
# give "error: Invalid value ... in '-solver-trail-threshold=...'" from the
# swift DRIVER, and the build then reports ZERO `: error:` lines - which
# reads as "the type-check error is gone" when the compile never ran.
#
# The best leg so far was scope=10000 + trail=1000000000 + time=6000000,
# which brought 87 errors down to 6. This pushes each to its maximum:
#   scope  = 2147483647
#   trail  = 2147483647
#   time   = 2147483647
#
# Legs:
#   a) all three at the 32-bit maximum
#   b) all three at the maximum, with a much longer time budget
#   c) the maximum, plus the memory threshold at its maximum
#   d) the maximum, and -disable-constraint-solver-performance-hacks off
#
# No source change.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe10
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-max
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=2147483647 -Xfrontend -solver-trail-threshold=2147483647 -Xfrontend -solver-expression-time-threshold=2147483647'
          - name: b-max-time
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=2147483647 -Xfrontend -solver-trail-threshold=2147483647 -Xfrontend -solver-expression-time-threshold=2000000000'
          - name: c-max-memory
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=2147483647 -Xfrontend -solver-trail-threshold=2147483647 -Xfrontend -solver-expression-time-threshold=2147483647 -solver-memory-threshold 2147483647'
          - name: d-max-nohacks
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=2147483647 -Xfrontend -solver-trail-threshold=2147483647 -Xfrontend -solver-expression-time-threshold=2147483647 -Xfrontend -solver-disable-shrink'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: The flags
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          python3 Werkzeuge/probe_set_flags.py "$FLAGS"
          grep -n 'OTHER_SWIFT_FLAGS' project.yml

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the driver errors"
          grep -E 'Invalid value|Unknown argument' build.log | sort -u | head -5
          echo "=== the first errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -10
          exit 0
