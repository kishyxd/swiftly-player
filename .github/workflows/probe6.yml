name: probe6

# The Swift type checker gives up on the preview box expression in
# Sources/iOS/PlayerScreen.swift. Upstream builds the identical code (the
# macOS twin in Sources/macOS/PlayerScreen.swift has the same shape) on the
# author's Mac, so this is the solver hitting a budget, not a bug in the code.
#
# Legs:
#   b) the scope + trail + memory limits raised (the real levers)
#   c) a much larger expression time threshold
#   e) the Debug configuration, which upstream's own build docs use
#   f) the limits raised AND the time threshold raised together
#
# No source change. If a leg passes, the build needs no upstream patch.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe6
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: b-limits
            config: Release
            flags: '-Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000 -Xfrontend -solver-memory-threshold=4000000000'
          - name: c-time
            config: Release
            flags: '-Xfrontend -solver-expression-time-threshold=600000'
          - name: e-debug
            config: Debug
            flags: ''
          - name: f-all
            config: Release
            flags: '-Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000 -Xfrontend -solver-memory-threshold=4000000000 -Xfrontend -solver-expression-time-threshold=600000'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        env:
          FLAGS: ${{ matrix.flags }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            "OTHER_SWIFT_FLAGS=\$(inherited) $FLAGS" \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -20
          exit 0
