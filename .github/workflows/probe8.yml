name: probe8

# The Swift type checker gives up on a set of view expressions:
#   "the compiler is unable to type-check this expression in reasonable time"
#
# What has been established so far:
#   * Xcode 26.3 is required (the runner default 16.4 cannot compile it)
#   * the code is upstream's and upstream ships it - not a bug
#   * the solver has a WALL CLOCK budget, and a CI runner is slower than the
#     author's Mac
#   * raising the SCOPE threshold fixes PlayerScreen but then 33-87 OTHER
#     files hit the TIME limit instead
#
# So both budgets have to be raised, and the flag has to be scoped to the app
# target so the package targets keep their own defaults.
#
# Legs:
#   a) scope + trail + a very large time threshold
#   b) the same plus the memory threshold (SPACE syntax, not `=`)
#   c) only the time threshold, very large
#   d) scope + trail + time, with the whole module built in one go
#
# The flags go into the Swiftly-iOS target in project.yml, so the JellyfinKit
# package is untouched.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe8
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-scope-trail-time
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000 -Xfrontend -solver-expression-time-threshold=600000'
          - name: b-with-memory
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=1000 -Xfrontend -solver-trail-threshold=100000000 -Xfrontend -solver-expression-time-threshold=600000 -solver-memory-threshold=4000000000'
          - name: c-time-only
            flags: '$(inherited) -Xfrontend -solver-expression-time-threshold=600000'
          - name: d-bigger-time
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=10000 -Xfrontend -solver-trail-threshold=1000000000 -Xfrontend -solver-expression-time-threshold=6000000'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: The flags
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          python3 Werkzeuge/probe_set_flags.py "$FLAGS"
          grep -n 'OTHER_SWIFT_FLAGS' project.yml

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the first errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -10
          exit 0
