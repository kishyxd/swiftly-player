name: FTVPlayer-iOS-Xcode-Probe

# One-off diagnostic: which Xcode can compile the iOS target?
#
# The upstream project never does a full iOS build in CI (the framework is
# 2.7 GB), so the iOS target has only ever been compiled on the author's
# machine with a specific Xcode. This probe finds the runner/toolchain
# combination that actually compiles it.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-xcode-probe
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: ''
          - os: macos-15
            xcode: '16.4'
          - os: macos-26
            xcode: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: The installed Xcodes
        run: |
          ls -1 /Applications | grep -i xcode || true
          echo "--- the default"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework
          ls -la Vendor/

      - name: The project
        run: xcodegen generate

      - name: The compile
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          set -uo pipefail
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE}.app" || \
              echo "::warning::Xcode ${XCODE} is not installed, using the default"
          fi
          xcodebuild -version
          export DEVELOPER_DIR=$(xcode-select -p)
          # Compile only - no signing, no archive. We want the COMPILER
          # verdict, not the signature.
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "=== the errors"
          grep -E '^/.*: error:' build.log | sed 's/^/ERR /' | sort -u | head -40
          echo "=== the error count"
          grep -cE '^/.*: error:' build.log || echo 0
          exit 0
