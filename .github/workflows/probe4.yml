name: probe4

# The last compile error is a Swift type-checker timeout:
#   Sources/iOS/PlayerScreen.swift: the compiler is unable to type-check
#   this expression in reasonable time
#
# The expression is the body of the GeometryReader in `previewBox`. Upstream
# compiles it on the author's Mac; on a CI runner the solver gives up.
#
# Three candidate fixes, tested head to head, PLUS a dump of the solver's
# real flags (the guessed one may not exist under that name):
#   A) the current source (split + explicit types)
#   B) the whole GeometryReader body moved into a @ViewBuilder function that
#      takes a concrete CGSize, so the closure is one call
#   C) the same, plus a raised solver time threshold
#
# Nothing here is committed to main until one of them proves out.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe4
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-current
            variant: current
          - name: b-extracted
            variant: extracted
          - name: c-extracted-threshold
            variant: extracted
            flags: '-Xfrontend -solver-expression-time-threshold=20000'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: The solver flags
        run: |
          set +e
          SWIFTC=$(xcrun -f swiftc)
          echo "swiftc: $SWIFTC"
          "$SWIFTC" -frontend -help 2>&1 | grep -iE 'solver|expression-time|type-check' | head -30
          echo "--- the hidden ones"
          "$SWIFTC" -frontend -help-hidden 2>&1 | grep -iE 'solver|expression-time|type-check' | head -30
          echo "--- the version"
          "$SWIFTC" --version

      - name: The variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = "extracted" ]; then
            python3 Werkzeuge/probe_extract_box.py Sources/iOS/PlayerScreen.swift
          fi
          grep -n 'previewBoxContent' Sources/iOS/PlayerScreen.swift | head

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -uo pipefail
          set +e
          # shellcheck disable=SC2086
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ${FLAGS:+OTHER_SWIFT_FLAGS="$(inherited) $FLAGS"} \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -20
          exit 0
