name: FTV-Silo-Portal

# Portal-side setup for FTV Silo:
#   1. register the app group the app and its extensions share
#   2. create the App Store Connect app record
#
# The App Store Connect API key cannot create app records (the `apps` resource
# only allows GET/UPDATE) and there is no /v1/appGroups resource, so this goes
# through a Developer Portal session via spaceship / fastlane.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'The app name'
        required: false
        default: 'FTV Silo'
      bundle_id:
        description: 'The bundle id'
        required: false
        default: 'com.kxvn.ftvsilo'
      sku:
        description: 'The SKU'
        required: false
        default: 'ftvsilo'
      app_group:
        description: 'The app group id'
        required: false
        default: 'group.com.kxvn.ftvsilo'

permissions:
  contents: write

jobs:
  setup:
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NEW_APP_NAME: ${{ inputs.app_name }}
      NEW_BUNDLE_ID: ${{ inputs.bundle_id }}
      NEW_SKU: ${{ inputs.sku }}
      NEW_APP_GROUP: ${{ inputs.app_group }}
    steps:
      - name: The portal session
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_SKIP_2FA: 'true'
        run: |
          set +x
          cd /tmp
          echo "### fastlane spaceauth (the Developer Portal session)"
          timeout 300 fastlane spaceauth -u "$APPLE_ID" -s "$APPLE_APP_SPEC_PW" -t "$APPLE_TEAM_ID" 2>&1 | tail -14 | tee sa.txt
          echo "### pull the session token out"
          SESSION="$(grep -Eo 'FASTLANE_SESSION=[A-Za-z0-9=+/]{40,}' sa.txt | tail -1 | cut -d= -f2-)"
          if [ -z "$SESSION" ]; then
            SESSION="$(grep -Eo '[A-Za-z0-9=+/]{80,}' sa.txt | tail -1)"
          fi
          if [ -n "$SESSION" ]; then
            echo "FASTLANE_SESSION=$SESSION" >> "$GITHUB_ENV"
            echo "GOT A SESSION (${#SESSION} chars)"
          else
            echo "NO SESSION"
          fi

      - name: The app group and the app record
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPEC_PW }}
          FASTLANE_SKIP_2FA: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          cd /tmp
          cat > /tmp/mk.rb <<'RUBY'
          require 'fastlane'
          require 'spaceship'
          require 'base64'

          U  = ENV['FASTLANE_USER']
          P  = ENV['FASTLANE_PASSWORD']
          BID = ENV['NEW_BUNDLE_ID']
          NAME = ENV['NEW_APP_NAME']
          SKU = ENV['NEW_SKU']
          GRP = ENV['NEW_APP_GROUP']

          # The portal login tries to fetch an API key from App Store Connect
          # and times out. Give spaceship the key we already have so it does
          # not have to.
          begin
            raw = ENV['ASC_KEY_P8'].to_s
            raw = Base64.decode64(raw) unless raw.start_with?('-----')
            Spaceship::ConnectAPI.token = {
              key_id: ENV['ASC_KEY_ID'], issuer_id: ENV['ASC_ISSUER_ID'],
              key: raw, duration: 1200
            }
            puts "TOKEN_SET"
          rescue => e
            puts "TOKEN_FAIL #{e.class}: #{e.message.to_s[0,300]}"
          end

          client = Spaceship::PortalClient.new
          begin
            client.login(U, P)
            puts "LOGIN_OK #{client.class}"
          rescue => e
            puts "LOGIN_FAIL #{e.class}: #{e.message.to_s[0,400]}"
          end

          begin
            groups = client.app_groups
            puts "APP_GROUPS #{groups.size}"
            groups.each { |g| puts "APP_GROUP #{g.group_id} | #{g.name} | #{g.id}" }
            found = groups.find { |g| g.group_id == GRP }
            if found
              puts "APP_GROUP_EXISTS #{found.group_id} | #{found.id}"
            else
              made = client.create_app_group!(name: NAME, group_id: GRP)
              puts "APP_GROUP_CREATED #{made.group_id} | #{made.id}"
            end
          rescue => e
            puts "APP_GROUP_FAIL #{e.class}: #{e.message.to_s[0,500]}"
          end

          begin
            apps = client.apps
            puts "PORTAL_APPS #{apps.size}"
            apps.each { |a| puts "PORTAL_APP #{a.id} | #{a.name} | #{a.bundle_id}" }
            existing = apps.find { |a| a.bundle_id == BID }
            if existing
              puts "APP_EXISTS #{existing.bundle_id} | #{existing.id}"
            else
              made = client.create_app!(name: NAME, bundle_id: BID, sku: SKU)
              puts "APP_CREATED #{made.bundle_id} | #{made.id} | #{made.name}"
            end
          rescue => e
            puts "APP_FAIL #{e.class}: #{e.message.to_s[0,700]}"
          end
          RUBY
          ruby /tmp/mk.rb 2>&1 | tee a1.txt | tail -70

      - name: The output
        uses: actions/upload-artifact@v4
        with:
          name: ftv-silo-portal
          path: /tmp/a1.txt
          retention-days: 7
