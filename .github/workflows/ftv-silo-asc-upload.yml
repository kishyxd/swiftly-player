name: FTV-Silo-ASC-Upload

# Uploads an already-signed FTV Silo IPA to App Store Connect.
#
# The IPA is signed on the VPS (zsign, with the KXVN distribution cert and
# the com.kxvn.ftvsilo App Store profile) and hosted on the CDN, so this
# workflow only has to fetch it and hand it to altool.
#
# Note: the ASC buildUploads API is NOT used here. It accepts the whole file
# but the build stays in AWAITING_UPLOAD forever and never appears. altool
# is the method that actually works.
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "The CDN URL of the signed IPA"
        required: true
      version:
        description: "The marketing version"
        default: "1.0.0"
permissions:
  contents: read
jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the IPA
        run: |
          set -uo pipefail
          for U in "${{ inputs.ipa_url }}" "https://cdn.kxvn.io/u/FTV-Silo-iOS.ipa"; do
            echo "### trying $U"
            curl -sSL -o "$RUNNER_TEMP/ftv-silo.ipa" "$U"
            SIZE=$(stat -f%z "$RUNNER_TEMP/ftv-silo.ipa" 2>/dev/null || echo 0)
            echo "   got $SIZE bytes"
            if unzip -t "$RUNNER_TEMP/ftv-silo.ipa" > /dev/null 2>&1; then
              echo "   the IPA is a valid zip"
              echo "   $U" > "$RUNNER_TEMP/ipa_source.txt"
              break
            fi
            echo "   not a zip, the body was:"
            head -c 600 "$RUNNER_TEMP/ftv-silo.ipa"
            echo
          done
          [ -f "$RUNNER_TEMP/ipa_source.txt" ] || { echo "::error::could not fetch the IPA"; exit 1; }

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPEC_PW: ${{ secrets.APPLE_APP_SPEC_PW }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          # altool authenticates with the Apple ID and the app-specific
          # password. That is the form that has actually uploaded for this
          # account; the API-key form fails the JWT step.
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/ftv-silo.ipa" \
            --type ios \
            -u "$APPLE_ID" -p "$APPLE_APP_SPEC_PW" --team-id "$APPLE_TEAM_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          # Trust ONLY the literal success line. A broad error scan marks a
          # successful upload as a failure.
          grep -q "No errors uploading" "$RUNNER_TEMP/altool.log" || {
            echo "::error::the upload did not succeed"; exit 1; }
          echo "UPLOAD_OK"

      - name: The outcome
        run: |
          {
            echo "### the upload log"
            tail -30 "$RUNNER_TEMP/altool.log" || true
          } >> "$GITHUB_STEP_SUMMARY"
