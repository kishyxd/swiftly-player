name: probe9

# The constraint solver still gives up on a few view expressions after the
# scope/trail/time budgets are raised (87 -> 6 errors).
#
# The remaining lever is the MEMORY threshold. Its syntax is different from
# the others:
#   -solver-memory-threshold <value>      <- SPACE, and NOT through -Xfrontend
#
# -Xfrontend takes exactly one argument, so it cannot carry a space-separated
# value. And the swift DRIVER rejects the `=` form with
#   error: Unknown argument: '-solver-memory-threshold=...'
# ...which then reports ZERO `: error:` lines and looks like the type-check
# error is gone. It is not.
#
# The working form is a plain flag pair in OTHER_SWIFT_FLAGS:
#   -solver-memory-threshold 4000000000
#
# Legs:
#   a) scope + trail + time + memory (the space form)
#   b) the same, with the memory threshold much larger
#   c) memory alone, very large
#   d) the same as (a) but with the flags ALSO on the command line, so the
#      package targets get them too
#
# No source change: `Sources/iOS/PlayerScreen.swift` is upstream's code.

on:
  workflow_dispatch:

concurrency:
  group: ftvplayer-probe9
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-memory
            cmdflags: ''
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=10000 -Xfrontend -solver-trail-threshold=1000000000 -Xfrontend -solver-expression-time-threshold=6000000 -solver-memory-threshold 4000000000'
          - name: b-memory-big
            cmdflags: ''
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=100000 -Xfrontend -solver-trail-threshold=10000000000 -Xfrontend -solver-expression-time-threshold=60000000 -solver-memory-threshold 16000000000'
          - name: c-memory-only
            cmdflags: ''
            flags: '$(inherited) -solver-memory-threshold 16000000000'
          - name: d-memory-on-cmdline
            cmdflags: '-solver-memory-threshold 16000000000'
            flags: '$(inherited) -Xfrontend -solver-scope-threshold=100000 -Xfrontend -solver-trail-threshold=10000000000 -Xfrontend -solver-expression-time-threshold=60000000'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26.*.app 2>/dev/null \
                      | grep -vE '\.0\.app$' | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: The flags
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          python3 Werkzeuge/probe_set_flags.py "$FLAGS"
          grep -n 'OTHER_SWIFT_FLAGS' project.yml

      - name: XcodeGen
        run: brew install xcodegen

      - name: The framework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          bash Werkzeuge/vlckit-fetch.sh
          rm -rf Vendor/VLCKit-gepatcht.xcframework
          mv Vendor/VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: The project
        run: xcodegen generate

      - name: The compile
        env:
          CMDFLAGS: ${{ matrix.cmdflags }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project Swiftly.xcodeproj \
            -scheme Swiftly-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ${CMDFLAGS:+OTHER_SWIFT_FLAGS="$(inherited) $CMDFLAGS"} \
            build 2>&1 | tee build.log
          echo "=== BUILD VERDICT"
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          echo "=== the error count"
          grep -cE ': error:' build.log || echo 0
          echo "=== the driver errors"
          grep -E 'Unknown argument|error:' build.log | grep -v '/Users/runner' | sort -u | head -5
          echo "=== the first errors"
          grep -E ': error:' build.log | sed 's/^/ERR /' | sort -u | head -10
          exit 0
